<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MetaMask Test</title>
  <script src="[cdnjs.cloudflare.com](https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.1/ethers.umd.min.js)"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1120;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .box {
      width: 100%;
      max-width: 500px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 20px;
      padding: 24px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(90deg, #0891b2, #0ea5e9);
      color: white;
    }
    pre {
      background: #020617;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 12px;
      margin-top: 16px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>MetaMask Connection Test</h2>
    <button onclick="connectWallet()">Connect Wallet</button>
    <pre id="out">Ready.</pre>
  </div>

  <script>
    async function connectWallet() {
      const out = document.getElementById("out");

      if (!window.ethereum) {
        out.textContent = "MetaMask not detected.";
        return;
      }

      if (!window.ethers) {
        out.textContent = "Ethers library not loaded.";
        return;
      }

      try {
        out.textContent = "Connecting...";
        const provider = new ethers.BrowserProvider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        const signer = await provider.getSigner();
        const address = await signer.getAddress();
        const network = await provider.getNetwork();

        out.textContent =
          "Connected successfully.\n" +
          "Address: " + address + "\n" +
          "Chain ID: " + network.chainId.toString();
      } catch (e) {
        out.textContent = "Error: " + (e.reason || e.message || String(e));
      }
    }
  </script>
</body>
</html>
