<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeBridge V10.1 - FINTECH ECOSYSTEM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #050814;
            --bg-card: #0c1125;
            --bg-input: #121833;
            --border-color: #1e264a;
            --primary-blue: #3b82f6;
            --primary-green: #10b981;
            --primary-yellow: #f59e0b;
            --primary-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            background-color: var(--bg-card);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 600px;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--primary-blue), var(--primary-green));
            border-radius: 20px 20px 0 0;
        }

        .header { text-align: center; margin-bottom: 35px; }
        .header h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 32px; font-weight: 700; letter-spacing: 1px;
            background: linear-gradient(135deg, #ffffff 0%, var(--text-muted) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header p { color: var(--primary-green); font-size: 14px; font-weight: bold; letter-spacing: 3px; text-transform: uppercase; margin-top: 5px; }

        h3 {
            font-family: 'Poppins', sans-serif; font-size: 16px; color: var(--primary-blue); text-transform: uppercase; letter-spacing: 1.5px;
            margin-top: 35px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;
        }

        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 14px; font-weight: 500; }

        input, select {
            width: 100%; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--border-color);
            background-color: var(--bg-input); color: var(--text-main); font-family: inherit; font-size: 16px; transition: all 0.3s ease;
        }
        input:focus, select:focus { border-color: var(--primary-blue); outline: none; box-shadow: 0 0 12px rgba(59, 130, 246, 0.3); }

        button {
            width: 100%; padding: 16px; border: none; border-radius: 10px; font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 600;
            cursor: pointer; margin-bottom: 12px; display: flex; justify-content: center; align-items: center; gap: 10px; transition: all 0.3s ease;
        }

        .btn-connect { background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); color: white; box-shadow: 0 4px 15px rgba(22, 163, 74, 0.3); }
        .btn-connect:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(22, 163, 74, 0.4); }
        .btn-action { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3); }
        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4); }
        .btn-withdraw { background: linear-gradient(135deg, #d97706 0%, #b45309 100%); color: white; box-shadow: 0 4px 15px rgba(217, 119, 6, 0.3); }
        .btn-withdraw:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(217, 119, 6, 0.4); }
        .btn-refund { background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%); color: white; box-shadow: 0 4px 15px rgba(220, 38, 38, 0.3); }
        .btn-refund:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(220, 38, 38, 0.4); }
        .btn-query { background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%); color: white; box-shadow: 0 4px 15px rgba(13, 148, 136, 0.3); }
        .btn-query:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(13, 148, 136, 0.4); }

        .log-box {
            background-color: #03050b; border: 1px solid var(--border-color); border-radius: 10px; padding: 14px;
            font-family: monospace; font-size: 13px; color: var(--text-muted); max-height: 140px; overflow-y: auto; margin-top: 25px; white-space: pre-wrap; line-height: 1.5;
        }

        .report-panel { margin-top: 20px; padding: 20px; border-radius: 12px; font-size: 14px; line-height: 1.6; display: none; }
        .report-success { background: rgba(16, 185, 129, 0.1); border: 1px solid var(--primary-green); color: #a7f3d0; }
        .report-error { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--primary-red); color: #fca5a5; }

        .report-table { width: 100%; margin-top: 12px; border-collapse: collapse; font-family: monospace; }
        .report-table td { padding: 5px 0; vertical-align: top; }
        .report-table td.label { width: 140px; font-weight: bold; color: var(--primary-yellow); }
        .report-error .report-table td.label { color: #f87171; }
        .report-link { color: #38bdf8; text-decoration: underline; word-break: break-all; }

        .status-panel { background-color: var(--bg-input); border-radius: 12px; padding: 16px; font-size: 15px; margin-top: 15px; border-left: 4px solid var(--primary-blue); line-height: 1.6; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>SAFEBRIDGE</h2>
        <p>Escrow Fintech Platform</p>
    </div>
    
    <button id="connectButton" class="btn-connect" onclick="connectWallet()">
        <i class="fa-solid fa-wallet"></i> 1. CÜZDAN HATTINI BAĞLA
    </button>
    
    <div class="form-group">
        <label for="networkSelect">İşlem Yapılacak Blockchain Ağı</label>
        <select id="networkSelect" onchange="handleNetworkChange()">
            <option value="0x13882" selected>Polygon Amoy Testnet (USDT)</option>
            <option value="0x89">Polygon Mainnet (USDT)</option>
            <option value="0x38">BNB Smart Chain (USDT)</option>
        </select>
    </div>

    <h3><i class="fa-solid fa-lock"></i> KASAYA KİLİTLEME İSTASYONU</h3>
    <div class="form-group">
        <label for="aliciAdresi">Alıcı Cüzdan Adresi</label>
        <input type="text" id="aliciAdresi" placeholder="0x..." autocomplete="off">
    </div>
    
    <div class="form-group">
        <label id="miktarLabel" for="miktarInput">Gönderilecek Miktar (USDT)</label>
        <input type="text" id="miktarInput" value="10" placeholder="10">
    </div>
    
    <div class="form-group">
        <label for="sureInput">Emanet Blok Süresi (Saniye Cinsinden)</label>
        <input type="text" id="sureInput" value="3600" placeholder="Örn: 3600 (1 Saat)">
    </div>
    
    <button class="btn-action" onclick="createTransaction()">
        <i class="fa-solid fa-vault"></i> 2. BLOCKCHAIN KİLİDİNİ VUR
    </button>
    
    <h3><i class="fa-solid fa-key"></i> KASA TRANSFER / İADE EMİRLERİ</h3>
    <div class="form-group">
        <label for="islemIdInput">İşlem ID (Kasa Takip Numarası)</label>
        <input type="text" id="islemIdInput" placeholder="Örn: 0">
    </div>
    
    <button class="btn-withdraw" onclick="completeTransaction()">
        <i class="fa-solid fa-hand-holding-dollar"></i> 3. ALICI OLARAK ONAYLA VE PARAYI ÇEK
    </button>
    <button class="btn-refund" onclick="refundTransaction()">
        <i class="fa-solid fa-arrow-rotate-left"></i> 4. GÖNDEREN OLARAK SÜRESİ DOLANI İADE AL
    </button>
    
    <h3><i class="fa-solid fa-chart-line"></i> BLOCKCHAIN DURUM SENSÖRÜ</h3>
    <div class="form-group">
        <label for="sorguIdInput">Sorgulanacak İşlem ID</label>
        <input type="text" id="sorguIdInput" placeholder="Örn: 0">
    </div>
    
    <button class="btn-query" onclick="checkTransactionStatus()">
        <i class="fa-solid fa-magnifying-glass-chart"></i> KASA DURUMUNU CANLI SORGULA
    </button>
    
    <div id="sorguSonuc" class="status-panel" style="display: none;"></div>
    <div id="raporPaneli" class="report-panel"></div>
    
    <div id="logKutusu" class="log-box">[SİSTEM] > SafeBridge V10.1 kalibrasyon şasisi hazır abi.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js" type="text/javascript"></script>

<script>
    const rawContractAddress = "0x40A42a59a72F571BEE77CE1e3aEAA54d2466986A"; 
    const contractABI = [
        "function emanetOlustur(address _alici, uint256 _miktar, uint256 _sureSaniye) external",
        "function aliciOnayVer(uint256 _id) external",
        "function otonomIadeTetikle(uint256 _id) external",
        "function islemler(uint256 id) external view returns (address, address, uint256, uint256, bool, bool)"
    ];
    const contractAddresses = { "0x13882": rawContractAddress, "0x89": rawContractAddress, "0x38": rawContractAddress };

    let provider, signer, contract;

    function handleNetworkChange() { logMesaji(`Sistem otonom USDT modunda hazır abi.`); }

    function raporOlustur(durum, baslik, detaylar = {}) {
        const panel = document.getElementById("raporPaneli");
        panel.style.display = "block";
        panel.className = `report-panel ${durum === 'BAŞARILI' ? 'report-success' : 'report-error'}`;
        let icerik = `<strong>${durum === 'BAŞARILI' ? '<i class="fa-solid fa-circle-check"></i> İŞLEM BAŞARI RAPORU' : '<i class="fa-solid fa-triangle-exclamation"></i> OBD ARIZA DETAY RAPORU'}</strong><br><span style="font-size: 16px; font-weight: bold; display:block; margin-top:4px;">${baslik}</span><table class="report-table">`;
        for (const [key, val] of Object.entries(detaylar)) { icerik += `<tr><td class="label">• ${key}:</td><td>${val}</td></tr>`; }
        icerik += `</table>`; panel.innerHTML = icerik;
    }

    function arizaCozumle(error, islemTipi) {
        let baslik = "Bilinmeyen Akıllı Sözleşme Kaçağı";
        let detaylar = { "İşlem İstasyonu": islemTipi, "Teşhis Kodu": "ERR_UNKNOWN_BLOCKCHAIN", "Kök Sebebi": "Blockchain düğümünden anlık veri paketi çözülemedi abi.", "Çözüm Önerisi": "Sorgulama panelinden ID durumunu kontrol edin abi." };
        if (!error) return { baslik, detaylar };
        const errorString = error.toString().toLowerCase();
        const errorMessage = error.message ? error.message.toLowerCase() : "";

        if (errorString.includes("user rejected") || errorMessage.includes("user rejected")) {
            baslik = "Kullanıcı Onay İptal Arızası";
            detaylar = { "İşlem İstasyonu": islemTipi, "Teşhis Kodu": "OBD_USER_REJECTED_4001", "Kök Sebebi": "MetaMask cüzdan onay ekranı kullanıcı tarafından reddedildi.", "Çözüm Önerisi": "Butona tekrar tıklayıp cüzdandan gelen işleme onay verin abi." };
        } else if (errorString.includes("insufficient funds") || errorMessage.includes("insufficient funds")) {
            baslik = "Yetersiz Gas (Ateşleme) Arızası";
            detaylar = { "İşlem İstasyonu": islemTipi, "Teşhis Kodu": "OBD_INSUFFICIENT_GAS_POL", "Kök Sebebi": "İşlemi blockchain ağına kazımak için cüzdandaki POL bakiyesi yetersiz.", "Çözüm Önerisi": "Amoy hattından gelen test POL bakiyenizi kontrol edin abi." };
        } else if (errorString.includes("call revert exception") || errorString.includes("reverted")) {
            baslik = "Sözleşme Mantık Kuralları Revert Filtresi";
            detaylar = { "İşlem İstasyonu": islemTipi, "Teşhis Kodu": "OBD_SOLIDITY_REVERT_RULE", "Kök Sebebi": "Sözleşme kuralları ihlal edildi. Süresi dolmuş işleme Alıcı Onayı verilemez veya süresi dolmamış işlem iade edilemez abi.", "Çözüm Önerisi": "Eğer kasa arayüzünde süre doldu yazıyorsa kırmızı renkli 'İADE AL' butonunu kullanın abi." };
        }
        if (error.code) detaylar["Cüzdan Hata Kodu"] = error.code;
        raporOlustur("ARIZA/HATA", baslik, detaylar);
    }

    async function switchNetwork(targetChainId) {
        try { await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: targetChainId }] }); return true; }
        catch (switchError) { arizaCozumle(switchError, "Ağ Değiştirme Vitesi"); return false; }
    }

    async function connectWallet() {
        document.getElementById("raporPaneli").style.display = "none";
        if (typeof window.ethereum !== 'undefined') {
            try {
                const targetChainId = document.getElementById('networkSelect').value;
                const currentChainId = await window.ethereum.request({ method: 'eth_chainId' });
                if (currentChainId !== targetChainId) { const success = await switchNetwork(targetChainId); if (!success) return; }
                provider = new ethers.BrowserProvider(window.ethereum); signer = await provider.getSigner();
                const activeContractAddress = contractAddresses[targetChainId];
                const temizKontratAdresi = ethers.getAddress(activeContractAddress.toLowerCase());
                contract = new ethers.Contract(temizKontratAdresi, contractABI, signer);
                const connectBtn = document.getElementById('connectButton');
                connectBtn.innerHTML = `<i class="fa-solid fa-circle-check"></i> HAT BAĞLANDI: ${signer.address.substring(0, 6).toUpperCase()}...`; 
                connectBtn.style.background = 'linear-gradient(135deg, #15803d 0%, #166534 100%)';
                logMesaji(`Cüzdan hattı başarıyla bağlandı abi.`);
            } catch (error) { arizaCozumle(error, "Cüzdan Bağlantı İstasyonu"); }
        } else { raporOlustur("ARIZA/HATA", "MetaMask Sürücü Eksikliği", { "Teşhis Kodu": "OBD_NO_METAMASK", "Çözüm Önerisi": "Lütfen tarayıcınıza MetaMask kurun abi." }); }
    }

    if (typeof window.ethereum !== 'undefined') { window.ethereum.on('chainChanged', () => { connectWallet(); }); }

    async function createTransaction() {
        document.getElementById("raporPaneli").style.display = "none"; logMesaji("Emanet kaydı hazırlanıyor...");
        try {
            const aliciRaw = document.getElementById('aliciAdresi').value.trim();
            let miktarRaw = document.getElementById('miktarInput').value.trim(); const sureRaw = document.getElementById('sureInput').value.trim();
            miktarRaw = miktarRaw.replace(',', '.');
            if (!aliciRaw || !miktarRaw || isNaN(parseFloat(miktarRaw)) || !sureRaw || isNaN(parseInt(sureRaw))) {
                raporOlustur("ARIZA/HATA", "Form Giriş Hatası", { "Kök Sebebi": "Alanlar eksik veya hatalı girildi abi." }); return;
            }
            const alici = ethers.getAddress(aliciRaw.toLowerCase()); if (!signer || !contract) return;
            const miktarWei = ethers.parseUnits(miktarRaw, 6); const sureSaniye = BigInt(sureRaw);

            logMesaji("MetaMask onay penceresi tetikleniyor...");
            const tx = await contract.emanetOlustur(alici, miktarWei, sureSaniye, { gasLimit: 300000, maxPriorityFeePerGas: ethers.parseUnits("40", "gwei"), maxFeePerGas: ethers.parseUnits("50", "gwei") });
            await tx.wait();
            logMesaji("BAŞARILI: Emanet kaydı blockchain kasasına kilitlendi abi!");
            raporOlustur("BAŞARILI", "Emanet Kasası Kuruldu", { "İşlem Türü": "USDT Emanet Kilitleme", "Kilit": "Blockchain Otonom Kasa" });
        } catch (error) { arizaCozumle(error, "Emanet Kasası Kurma İstasyonu"); }
    }

    async function completeTransaction() {
        document.getElementById("raporPaneli").style.display = "none"; logMesaji("Alıcı onay işlemi başlatılıyor...");
        try {
            const islemId = document.getElementById('islemIdInput').value.trim(); if (!islemId || isNaN(parseInt(islemId))) return; if (!signer || !contract) return;
            logMesaji(`MetaMask tetikleniyor, ID: ${islemId} onaylanıyor...`);
            const tx = await contract.aliciOnayVer(BigInt(islemId), { gasLimit: 250000, maxPriorityFeePerGas: ethers.parseUnits("40", "gwei"), maxFeePerGas: ethers.parseUnits("50", "gwei") });
            
            logMesaji("Mühür açma emri ağa yazılıyor...");
            await tx.wait(); // Blok mühürlendi, işlem kesin bitti abi!
            
            logMesaji("BAŞARILI: Para hesaba aktarıldı abi!");
            raporOlustur("BAŞARILI", "Mühür Kilit Açma Başarı Raporu", { "Sonuç": "USDT Alıcı Cüzdanına Aktarıldı" });
            
            // ⭐ KALİBRASYON: Blok kesin onaylandıktan sonra 5 saniyelik sayacı şimdi başlatıyoruz!
            logMesaji("Ağ senkronizasyonu için 5 saniye bekleniyor...");
            setTimeout(() => { checkTransactionStatusDirect(islemId); }, 5000);
        } catch (error) { arizaCozumle(error, "Alıcı Onay Verme İstasyonu"); }
    }

    async function refundTransaction() {
        document.getElementById("raporPaneli").style.display = "none"; logMesaji("Otonom iade işlemi başlatılıyor...");
        try {
            const islemId = document.getElementById('islemIdInput').value.trim(); if (!islemId || isNaN(parseInt(islemId))) return; if (!signer || !contract) return;
            logMesaji(`MetaMask tetikleniyor, ID: ${islemId} İade Süreci Başlatıldı...`);
            const tx = await contract.otonomIadeTetikle(BigInt(islemId), { gasLimit: 250000, maxPriorityFeePerGas: ethers.parseUnits("40", "gwei"), maxFeePerGas: ethers.parseUnits("50", "gwei") });
            
            logMesaji("İade faturası ağa kazınıyor...");
            await tx.wait(); // Blok mühürlendi, işlem kesin bitti abi!
            
            logMesaji("BAŞARILI: Emanet gönderene iade edildi abi!");
            raporOlustur("BAŞARILI", "Otonom İade Başarıyla Tamamlandı", { "Gerçekleşen İşlem": "Süresi Dolan USDT Gönderen Cüzdana İade Edildi" });
            
            // ⭐ KALİBRASYON: Blok kesin onaylandıktan sonra 5 saniyelik sayacı şimdi başlatıyoruz!
            logMesaji("Ağ senkronizasyonu için 5 saniye bekleniyor...");
            setTimeout(() => { checkTransactionStatusDirect(islemId); }, 5000);
        } catch (error) { arizaCozumle(error, "Otonom İade Tetikleme İstasyonu"); }
    }

    async function checkTransactionStatus() {
        const idInput = document.getElementById('sorguIdInput').value.trim();
        if (idInput === "" || isNaN(parseInt(idInput))) return;
        checkTransactionStatusDirect(idInput);
    }

    async function checkTransactionStatusDirect(idInput) {
        try {
            if (!provider) return;
            const activeChainId = document.getElementById('networkSelect').value;
            const targetContract = contractAddresses[activeChainId];
            const fonksiyonImzasi = "0x22f87a8b"; 
            const abiKodlayici = ethers.AbiCoder.defaultAbiCoder();
            const paketliParametreHex = abiKodlayici.encode(["uint256"], [BigInt(idInput)]);
            const dataPaketi = fonksiyonImzasi + paketliParametreHex.substring(2);

            const hamSonucHex = await provider.call({ to: targetContract, data: dataPaketi });
            if (!hamSonucHex || hamSonucHex === "0x" || hamSonucHex.length < 300) return;

            const safHex = hamSonucHex.substring(2); 
            const gonderenHex = "0x" + safHex.substring(24, 64); const aliciHex = "0x" + safHex.substring(88, 128);   
            const miktarWeiMetin = BigInt("0x" + safHex.substring(128, 192)).toString();
            const bitisZamaniMetin = BigInt("0x" + safHex.substring(192, 256)).toString();
            const tamamlandi = BigInt("0x" + safHex.substring(256, 320)) > 0n;
            const iadeEdildi = BigInt("0x" + safHex.substring(320, 384)) > 0n;

            const gonderen = ethers.getAddress(gonderenHex); const alici = ethers.getAddress(aliciHex);
            if (gonderen === "0x0000000000000000000000000000000000000000") {
                raporOlustur("ARIZA/HATA", "Kayıt Bulunamadı", { "ID No": idInput, "Açıklama": "Bu takip numarasına ait bir emanet kasası henüz kurulmamış abi." }); return;
            }

            const miktarNormal = ethers.formatUnits(miktarWeiMetin, 6); const bitisZamani = Number(bitisZamaniMetin);
            const kalanSureSaniye = bitisZamani - Math.floor(Date.now() / 1000);
            
            let sureDurumu = (tamamlandi || iadeEdildi) ? "Süreç Sonlandı" : (kalanSureSaniye > 0 ? `${Math.ceil(kalanSureSaniye / 60)} Dakika Kaldı` : "<span style='color:#f59e0b; font-weight:bold;'>Süre Doldu (İadeye Hazır)</span>");
            let durumYazisi = tamamlandi ? "<span style='color:#10b981; font-weight:bold;'>TAMAMLANDI (Alıcı Çekti)</span>" : (iadeEdildi ? "<span style='color:#ef4444; font-weight:bold;'>İADE EDİLDİ (Gönderene Döndü)</span>" : "<span style='color:#3b82f6; font-weight:bold;'>KASADA AKTİF (Onay Bekliyor)</span>");

            const sonucKutusu = document.getElementById('sorguSonuc'); sonucKutusu.style.display = "block";
            sonucKutusu.innerHTML = `<strong style="color: #f59e0b;"><i class="fa-solid fa-circle-info"></i> ID: ${idInput} Otonom Kasa Raporu:</strong><br>• Gönderen: ${gonderen.substring(0,8)}...${gonderen.substring(34)}<br>• Alıcı: ${alici.substring(0,8)}...${alici.substring(34)}<br>• Kilitli Tutar: <strong>${miktarNormal} USDT</strong><br>• Kalan Süre: <strong>${sureDurumu}</strong><br>• Güncel Durum: ${durumYazisi}`;
            logMesaji(`ID: ${idInput} durumu otonom güncellendi.`);
        } catch (error) { arizaCozumle(error, "Canlı Veri Sorgulama İstasyonu"); }
    }

    function logMesaji(mesaj) { const logKutusu = document.getElementById('logKutusu'); const zaman = new Date().toLocaleTimeString('tr-TR'); logKutusu.innerHTML += `<br>[${zaman}] > ${mesaj}`; logKutusu.scrollTop = logKutusu.scrollHeight; }
</script>
