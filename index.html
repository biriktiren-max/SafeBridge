<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>SafeBridge Global — Temporarily Unavailable</title>
  <style>
    :root {
      --bg: #030712;
      --text: #f3f4f6;
      --muted: #94a3b8;
      --cyan: #67e8f9;
      --violet: #a78bfa;
      --orange: #fb923c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(700px 420px at 15% 0%, rgba(34, 211, 238, 0.16), transparent 55%),
        radial-gradient(640px 380px at 90% 10%, rgba(167, 139, 250, 0.12), transparent 50%),
        radial-gradient(560px 320px at 70% 100%, rgba(251, 146, 60, 0.10), transparent 55%),
        linear-gradient(180deg, #020617 0%, #07111f 100%);
    }
    .card {
      width: min(520px, 100%);
      border: 1px solid #1e3a5f;
      border-radius: 22px;
      padding: 28px 24px;
      background: linear-gradient(165deg, rgba(11, 18, 32, 0.96), rgba(8, 47, 73, 0.35));
      box-shadow: 0 18px 40px rgba(2, 6, 23, 0.45);
      text-align: center;
    }
    .brand {
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0.02em;
      background: linear-gradient(90deg, var(--cyan), var(--violet), var(--orange));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(24px, 5vw, 32px);
      line-height: 1.2;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }
    .tr {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #1f2937;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">SafeBridge Global</div>
    <h1>Service temporarily suspended</h1>
    <p>The public site and app pages are paused. Escrow and Instant Transfer are not available right now.</p>
    <div class="tr">
      <h1 style="font-size:22px;margin-bottom:10px">Yayın geçici olarak askıda</h1>
      <p>Site ve uygulama sayfaları durduruldu. Emanet ve Anında Transfer şu anda kullanılamıyor.</p>
    </div>
  </main>
</body>
</html>
