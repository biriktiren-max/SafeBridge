<script>
  const APP_CONFIG = {
    escrowContract: "0xfb7bC77748EA420e3568d7AB782b5C9AF4Da6B12",
    feeRecipient: "0x68E0c1948900699E23a5490fcE4e376EDe21588D",
    feeRatePercent: 1,
    chainIdHex: "0x89",
    chainIdDec: 137
  };

  const TOKENS = {
    POL: { symbol: "POL", type: "native", address: null, decimals: 18 },
    USDT: { symbol: "USDT", type: "erc20", address: "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359", decimals: 6 },
    USDTE: { symbol: "USDT.e", type: "erc20", address: "0xc2132D05D31c914a87C6611C10748AEb04B58e8F", decimals: 6 },
    PAXG: { symbol: "PAXG", type: "erc20", address: "0x714db550b574b3e927fb3d93e26127d15721d4c2", decimals: 18 }
  };

  const ESCROW_ABI = [
    "function createEscrow(address payable _recipient, address _token, uint256 _grossAmount, bytes32 _passwordHash, uint256 _duration) external payable",
    "function releaseEscrow(uint256 _txId, string memory _password) external",
    "function refundEscrow(uint256 _txId) external",
    "function getTransaction(uint256 _txId) external view returns (address sender, address recipient, address token, uint256 amount, bytes32 passwordHash, uint256 timelock, uint256 createdAt, uint8 status)",
    "event EscrowCreated(uint256 indexed txId, address indexed sender, address indexed recipient, address token, uint256 grossAmount, uint256 feeAmount, uint256 netAmount, uint256 timelock)",
    "event EscrowReleased(uint256 indexed txId)",
    "event EscrowRefunded(uint256 indexed txId)"
  ];

  const ERC20_ABI = [
    "function approve(address spender, uint256 amount) external returns (bool)",
    "function allowance(address owner, address spender) external view returns (uint256)"
  ];

  let provider = null;
  let signer = null;
  let connectedAccount = null;
  let escrowContract = null;
  let activeEthereumProvider = null; // Bağlanan aktif eklenti objesini tutar
  const discoveredWallets = [];

  /* --- SİSTEM BAŞLATICI VE CANLI DİNLENME --- */
  window.addEventListener('DOMContentLoaded', async () => {
    updatePreviewSummary();

    // EIP-6963 Cüzdan duyurularını iste
    window.dispatchEvent(new Event("eip6963:requestProvider"));

    if (window.ethereum) {
      try {
        // Sayfa açılışında sessiz kontrol (Popup açmaz)
        const accounts = await window.ethereum.request({ method: 'eth_accounts' });
        if (accounts && accounts.length > 0) {
          await connectToWalletProvider(window.ethereum, accounts[0], 'Varsayılan Cüzdan');
        } else {
          setStatus('Sistem hazır. Lütfen cüzdanınızı bağlayın.');
        }
      } catch (e) {
        setStatus('Sistem hazır. Lütfen cüzdanınızı bağlayın.');
      }
    } else {
      setStatus('Web3 Provider bulunamadı. Lütfen bir cüzdan eklentisi kurun.', 'error');
    }
  });

  /* Dinamik Cüzdan Dinleyicisi (Aşırı Kritik: Rabby/OKX/MetaMask geçişleri için) */
  function setupProviderListeners(ethProvider) {
    if (!ethProvider || typeof ethProvider.on !== 'function') return;

    ethProvider.on('accountsChanged', async (accs) => {
      if (accs && accs.length > 0) {
        await connectToWalletProvider(ethProvider, accs[0], 'Cüzdan');
      } else {
        disconnectState();
      }
    });

    ethProvider.on('chainChanged', () => {
      window.location.reload();
    });
  }

  async function connectToWalletProvider(ethProvider, targetAccount = null, walletName = 'Cüzdan') {
    try {
      await ensureEthersLoaded();
    } catch (e) {
      return setStatus('Ethers.js kütüphanesi yüklenemedi.', 'error');
    }

    try {
      setStatus(`${walletName} bağlantısı kuruluyor...`);
      activeEthereumProvider = ethProvider;
      setupProviderListeners(activeEthereumProvider);

      provider = new ethers.BrowserProvider(ethProvider);

      // Ağ Kontrolü (Polygon Mainnet - 137)
      const chainId = await ethProvider.request({ method: 'eth_chainId' });
      if (chainId !== APP_CONFIG.chainIdHex) {
        try {
          await ethProvider.request({
            method: 'wallet_switchEthereumChain',
            params: [{ chainId: APP_CONFIG.chainIdHex }]
          });
        } catch (e) {
          return setStatus('Lütfen Polygon Mainnet (137) ağına geçiş yapın.', 'error');
        }
      }

      let accounts = targetAccount ? [targetAccount] : [];
      if (!targetAccount) {
        accounts = await provider.send('eth_requestAccounts', []);
      }

      connectedAccount = accounts[0];
      signer = await provider.getSigner();
      escrowContract = new ethers.Contract(APP_CONFIG.escrowContract, ESCROW_ABI, signer);

      const btn = document.getElementById('connectBtn');
      if (btn) btn.textContent = `${connectedAccount.substring(0, 6)}...${connectedAccount.substring(38)}`;

      setStatus(`Bağlandı: ${connectedAccount.substring(0, 6)}...${connectedAccount.substring(38)}`, 'success');
      closeModal();
    } catch (e) {
      setStatus(parseWeb3Error(e), 'error');
    }
  }

  function disconnectState() {
    provider = null;
    signer = null;
    connectedAccount = null;
    escrowContract = null;
    activeEthereumProvider = null;
    const btn = document.getElementById('connectBtn');
    if (btn) btn.textContent = 'Connect Wallet';
    setStatus('Cüzdan bağlantısı kesildi.', 'info');
  }

  /* --- MODAL VE EIP-6963 CÜZDAN ALGILAMA --- */
  function openModal() {
    const modal = document.getElementById('walletModal');
    if (modal) modal.classList.add('active');
    window.dispatchEvent(new Event("eip6963:requestProvider"));
    
    // Eğer EIP-6963 ile cüzdan yakalanamadıysa varsayılan injected cüzdanı listelet
    if (discoveredWallets.length === 0 && window.ethereum) {
      renderDefaultInjectedCard();
    }
  }

  function closeModal() {
    const modal = document.getElementById('walletModal');
    if (modal) modal.classList.remove('active');
  }

  window.addEventListener("eip6963:announceProvider", (event) => {
    const providerDetail = event.detail;
    if (!discoveredWallets.some(w => w.info.uuid === providerDetail.info.uuid)) {
      discoveredWallets.push(providerDetail);
      renderWalletCard(providerDetail);
    }
  });

  function renderWalletCard(walletDetail) {
    const walletListContainer = document.getElementById('walletList');
    if (!walletListContainer) return;

    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'wallet-card';
    card.innerHTML = `
      <img src="${walletDetail.info.icon}" alt="${walletDetail.info.name}" />
      <div class="wallet-info">
        <span class="wallet-name">${walletDetail.info.name}</span>
        <span class="wallet-desc">Tarayıcı Eklentisi</span>
      </div>
    `;

    card.addEventListener('click', () => {
      connectToWalletProvider(walletDetail.provider, null, walletDetail.info.name);
    });

    walletListContainer.appendChild(card);
  }

  function renderDefaultInjectedCard() {
    const walletListContainer = document.getElementById('walletList');
    if (!walletListContainer || walletListContainer.querySelector('.injected-card')) return;

    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'wallet-card injected-card';
    card.innerHTML = `
      <div class="wallet-info">
        <span class="wallet-name">Varsayılan Cüzdan</span>
        <span class="wallet-desc">MetaMask / Rabby / Injected</span>
      </div>
    `;

    card.addEventListener('click', () => {
      connectToWalletProvider(window.ethereum, null, 'Tarayıcı Cüzdanı');
    });

    walletListContainer.appendChild(card);
  }

  function connectWallet() {
    openModal();
  }

  /* --- HATA METNİ TEMİZLEYİCİ (UI/UX) --- */
  function parseWeb3Error(error) {
    if (!error) return 'Bilinmeyen bir hata oluştu.';
    if (error.code === 4001 || error.code === 'ACTION_REJECTED') {
      return 'İşlem kullanıcı tarafından cüzdanda reddedildi.';
    }
    if (error.code === 'INSUFFICIENT_FUNDS' || error.message?.includes('insufficient funds')) {
      return 'Hesabınızda işlem tutarı ve gas ücreti için yeterli POL bulunmuyor.';
    }
    return error.reason || error.shortMessage || error.message || 'İşlem sırasında hata oluştu.';
  }

  /* --- ARAYÜZ VE HESAPLAMA MANTIKLARI --- */
  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    const map = { create: 'panelCreate', release: 'panelRelease', refund: 'panelRefund', dash: 'panelDash' };
    document.getElementById(map[tabId]).classList.add('active');
    btn.classList.add('active');
  }

  function genPass() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
    const bytes = new Uint8Array(12);
    crypto.getRandomValues(bytes);
    let p = '';
    for (let i = 0; i < bytes.length; i++) p += chars[bytes[i] % chars.length];
    document.getElementById('pass').value = p;
  }

  function copyPass() {
    const p = document.getElementById('pass').value.trim();
    if (!p) return setStatus('Kopyalanacak şifre bulunamadı.', 'error');
    navigator.clipboard.writeText(p);
    setStatus('Şifre panoya kopyalandı!', 'success');
  }

  function setStatus(message, type = 'info') {
    const box = document.getElementById('statusBox');
    if (!box) return;
    if (type === 'error') {
      box.style.borderColor = 'var(--red)';
      box.style.color = 'var(--red)';
    } else if (type === 'success') {
      box.style.borderColor = 'var(--emerald)';
      box.style.color = 'var(--emerald)';
    } else {
      box.style.borderColor = 'var(--border)';
      box.style.color = 'var(--text)';
    }
    box.textContent = message;
  }

  function getSelectedToken() {
    return TOKENS[document.getElementById('assetSelect').value];
  }

  function getTokenMetaByAddress(tokenAddress) {
    const normalized = String(tokenAddress || '').toLowerCase();
    if (normalized === '0x0000000000000000000000000000000000000000') return TOKENS.POL;
    for (const key of Object.keys(TOKENS)) {
      const token = TOKENS[key];
      if (token.address && token.address.toLowerCase() === normalized) return token;
    }
    return { symbol: 'UNKNOWN', decimals: 18, type: 'erc20', address: tokenAddress };
  }

  function calculatePreview(amountStr) {
    const gross = Number(amountStr);
    if (!Number.isFinite(gross) || gross <= 0) return { gross: 0, fee: 0, net: 0 };
    const fee = gross * (APP_CONFIG.feeRatePercent / 100);
    const net = gross - fee;
    return { gross, fee, net };
  }

  function formatAmount(value) {
    const num = Number(value);
    if (!Number.isFinite(num)) return '0.00';
    return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 6 });
  }

  function updateApprovalInfo() {
    const token = getSelectedToken();
    const box = document.getElementById('approvalFlowText');
    if (!box) return;
    if (token.type === 'native') {
      box.textContent = 'POL tek adımda kilitlenir, Approve (onay) adımı gerektirmez.';
    } else {
      box.textContent = `${token.symbol} bir ERC-20 token'ıdır. 2 aşamalı işlem gerektirir: Önce Approve, sonra Create Escrow.`;
    }
  }

  function updatePreviewSummary() {
    const amountValue = document.getElementById('amount').value;
    const preview = calculatePreview(amountValue);
    const token = getSelectedToken();
    document.getElementById('grossDisplay').textContent = `${formatAmount(preview.gross)} ${token.symbol}`;
    document.getElementById('feeDisplay').textContent = `${formatAmount(preview.fee)} ${token.symbol}`;
    document.getElementById('netDisplay').textContent = `${formatAmount(preview.net)} ${token.symbol}`;
    document.getElementById('assetHint').textContent = `Varlık: ${token.symbol}`;
    updateApprovalInfo();
  }

  /* --- SÖZLEŞME İŞLEMLERİ (CREATE, RELEASE, REFUND, DASHVIEW) --- */

  // 1. ESCROW OLUŞTURMA
  async function createEscrow() {
    if (!signer || !escrowContract) return setStatus('Lütfen önce cüzdanınızı bağlayın.', 'error');

    const recipient = document.getElementById('recipient').value.trim();
    const rawAmount = document.getElementById('amount').value.trim();
    const hours = document.getElementById('hours').value.trim();
    const password = document.getElementById('pass').value.trim();
    const token = getSelectedToken();

    if (!ethers.isAddress(recipient)) return setStatus('Geçersiz alıcı adresi.', 'error');
    if (!rawAmount || Number(rawAmount) <= 0) return setStatus('Tutar 0\'dan büyük olmalıdır.', 'error');
    if (!password || password.length < 8) return setStatus('Şifre en az 8 karakter olmalıdır.', 'error');
    if (hours === '' || Number(hours) < 0) return setStatus('Süre 0 veya daha fazla saat olmalıdır.', 'error');

    try {
      const grossAmountUnits = ethers.parseUnits(rawAmount, token.decimals);
      const durationSeconds = BigInt(hours) * 3600n;
      const passwordHash = ethers.keccak256(ethers.toUtf8Bytes(password));

      // ERC-20 Yetkilendirme Kontrolü (Approve Step)
      if (token.type === 'erc20') {
        const tokenContract = new ethers.Contract(token.address, ERC20_ABI, signer);
        setStatus('Harcama limiti kontrol ediliyor...');
        const currentAllowance = await tokenContract.allowance(connectedAccount, APP_CONFIG.escrowContract);

        if (currentAllowance < grossAmountUnits) {
          setStatus('Token onay işlemi isteniyor (Approve)...');
          const approveTx = await tokenContract.approve(APP_CONFIG.escrowContract, grossAmountUnits);
          setStatus('Onay işlemi ağda doğrulanıyor...');
          await approveTx.wait();
          setStatus('Onay alındı. Escrow kilit işlemi başlatılıyor...', 'success');
        }
      }

      setStatus('Escrow kilit işlemi cüzdana gönderildi...');
      let tx;

      if (token.type === 'native') {
        tx = await escrowContract.createEscrow(
          recipient,
          ethers.ZeroAddress,
          grossAmountUnits,
          passwordHash,
          durationSeconds,
          { value: grossAmountUnits }
        );
      } else {
        tx = await escrowContract.createEscrow(
          recipient,
          token.address,
          grossAmountUnits,
          passwordHash,
          durationSeconds
        );
      }

      setStatus('İşlem bloğa yazılıyor, lütfen bekleyin...');
      const receipt = await tx.wait();

      let txIdFound = null;
      for (const log of receipt.logs) {
        try {
          const parsed = escrowContract.interface.parseLog(log);
          if (parsed && parsed.name === 'EscrowCreated') {
            txIdFound = parsed.args.txId.toString();
            break;
          }
        } catch (_) {}
      }

      const resBox = document.getElementById('resultBox');
      if (resBox) {
        resBox.textContent = `İŞLEM BAŞARILI!\nTx Hash: ${receipt.hash}\nTransaction ID: ${txIdFound !== null ? txIdFound : 'Tespit Edilemedi'}\nBlok: ${receipt.blockNumber}`;
      }

      setStatus(`Escrow başarıyla oluşturuldu! ${txIdFound !== null ? 'İşlem ID: #' + txIdFound : ''}`, 'success');
    } catch (e) {
      console.error(e);
      setStatus(parseWeb3Error(e), 'error');
    }
  }

  // 2. KİLİT AÇMA (RELEASE)
  async function releaseEscrow() {
    if (!signer || !escrowContract) return setStatus('Lütfen önce cüzdanınızı bağlayın.', 'error');

    const txId = document.getElementById('relTxId').value.trim();
    const password = document.getElementById('relPass').value.trim();

    if (txId === '' || Number(txId) < 0) return setStatus('Geçersiz İşlem ID.', 'error');
    if (!password) return setStatus('Lütfen gizli şifreyi girin.', 'error');

    try {
      setStatus('Kilit açma işlemi başlatılıyor...');
      const tx = await escrowContract.releaseEscrow(txId, password);
      setStatus('İşlem ağda doğrulanıyor...');
      const receipt = await tx.wait();

      const resBox = document.getElementById('resultBox');
      if (resBox) {
        resBox.textContent = `KİLİT AÇILDI!\nTx Hash: ${receipt.hash}\nTransaction ID: ${txId}\nBlok: ${receipt.blockNumber}`;
      }
      setStatus(`İşlem #${txId} başarıyla çözüldü ve fonlar alıcıya aktarıldı!`, 'success');
    } catch (e) {
      console.error(e);
      setStatus(parseWeb3Error(e), 'error');
    }
  }

  // 3. ZAMAN AŞIMI İADESİ (REFUND)
  async function refundEscrow() {
    if (!signer || !escrowContract) return setStatus('Lütfen önce cüzdanınızı bağlayın.', 'error');

    const txId = document.getElementById('refTxId').value.trim();
    if (txId === '' || Number(txId) < 0) return setStatus('Geçersiz İşlem ID.', 'error');

    try {
      setStatus('İade talebi cüzdana gönderiliyor...');
      const tx = await escrowContract.refundEscrow(txId);
      setStatus('İşlem ağda doğrulanıyor...');
      const receipt = await tx.wait();

      const resBox = document.getElementById('resultBox');
      if (resBox) {
        resBox.textContent = `İADE EDİLDİ!\nTx Hash: ${receipt.hash}\nTransaction ID: ${txId}\nBlok: ${receipt.blockNumber}`;
      }
      setStatus(`İşlem #${txId} başarıyla iade edildi!`, 'success');
    } catch (e) {
      console.error(e);
      setStatus(parseWeb3Error(e), 'error');
    }
  }

  // 4. CANLI KASA SORGULAMA (DASHVIEW)
  async function queryEscrow() {
    let queryContract = escrowContract;

    if (!queryContract) {
      if (window.ethereum) {
        const tempProvider = new ethers.BrowserProvider(window.ethereum);
        queryContract = new ethers.Contract(APP_CONFIG.escrowContract, ESCROW_ABI, tempProvider);
      } else {
        return setStatus('Sorgulama yapmak için Web3 sağlayıcısı gerekli.', 'error');
      }
    }

    const txId = document.getElementById('qTxId').value.trim();
    if (txId === '' || Number(txId) < 0) return setStatus('Geçersiz İşlem ID.', 'error');

    try {
      setStatus(`İşlem ID #${txId} sorgulanıyor...`);
      const txData = await queryContract.getTransaction(txId);

      const statusMap = ["0 (Aktif / Kilitli)", "1 (Kilit Açıldı / Tamamlandı)", "2 (İade Edildi)"];
      const tokenMeta = getTokenMetaByAddress(txData.token);
      const amountFormatted = ethers.formatUnits(txData.amount, tokenMeta.decimals);
      const timelockDate = new Date(Number(txData.timelock) * 1000).toLocaleString('tr-TR');
      const createdDate = new Date(Number(txData.createdAt) * 1000).toLocaleString('tr-TR');

      const resDiv = document.getElementById('dashResult');
      if (resDiv) {
        resDiv.style.display = 'block';
        resDiv.innerHTML = `
          <div class="dash-item"><strong>İşlem ID:</strong> #${txId}</div>
          <div class="dash-item"><strong>Gönderen (Sender):</strong> ${txData.sender}</div>
          <div class="dash-item"><strong>Alıcı (Recipient):</strong> ${txData.recipient}</div>
          <div class="dash-item"><strong>Varlık (Asset):</strong> ${tokenMeta.symbol}</div>
          <div class="dash-item"><strong>Net Escrow Tutarı:</strong> ${amountFormatted} ${tokenMeta.symbol}</div>
          <div class="dash-item"><strong>Kilit Durumu:</strong> ${statusMap[txData.status] || txData.status}</div>
          <div class="dash-item"><strong>Oluşturulma Tarihi:</strong> ${createdDate}</div>
          <div class="dash-item"><strong>Kilit Açılma Zamanı (Timelock):</strong> ${timelockDate}</div>
        `;
      }
      setStatus(`İşlem ID #${txId} bilgileri getirildi.`, 'success');
    } catch (e) {
      console.error(e);
      setStatus(parseWeb3Error(e), 'error');
    }
  }
</script>
