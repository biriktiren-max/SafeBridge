<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeBridge — Instant Transfer Protocol</title>

  <!-- Ethers.js v6 CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.11.1/ethers.umd.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <style>
    :root {
      --bg-main: #050913;
      --card-bg: #0b1320;
      --input-bg: #070d18;
      --border: #1a273d;
      --text-main: #f3f4f6;
      --text-muted: #94a3b8;
      --cyan-bright: #00f2fe;
      --cyan-muted: #38bdf8;
      --green-accent: #059669;
      --green-bright: #10b981;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      color: var(--cyan-bright);
    }

    .btn-wallet {
      background: #0284c7;
      color: white;
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-wallet:hover { background: #0369a1; }

    .status-banner {
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid var(--green-accent);
      color: var(--green-bright);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
      word-break: break-all;
    }

    .form-group { margin-bottom: 18px; }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .form-group input, .form-group select {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus, .form-group select:focus { border-color: var(--cyan-muted); }

    .btn-submit {
      width: 100%;
      background: linear-gradient(90deg, #0284c7, #2563eb);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }

    .btn-submit:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>⚡ Instant Transfer</h1>
      <button class="btn-wallet" id="connectBtn" onclick="connectWallet()">Connect Wallet</button>
    </div>

    <!-- STATUS BANNER -->
    <div class="status-banner" id="statusBox">
      System ready. Please connect your Web3 wallet.
    </div>

    <div class="form-group">
      <label>Recipient Address</label>
      <input type="text" id="instantRecipient" placeholder="0x..." />
    </div>

    <div class="form-group">
      <label>Asset</label>
      <select id="instantAsset">
        <option value="POL">POL (Native Polygon)</option>
        <option value="USDT">USDT</option>
        <option value="USDTE">USDT.e</option>
        <option value="PAXG">PAXG</option>
      </select>
    </div>

    <div class="form-group">
      <label>Amount</label>
      <input type="number" id="instantAmount" placeholder="0.0" step="0.000001" min="0" />
    </div>

    <button class="btn-submit" onclick="sendInstant()">⚡ Send Direct Transfer</button>
  </div>

  <script>
    const CONFIG = {
      chainIdHex: "0x89" // Polygon Mainnet
    };

    const TOKENS = {
      POL: { symbol: "POL", type: "native", address: "0x0000000000000000000000000000000000000000", decimals: 18 },
      USDT: { symbol: "USDT", type: "erc20", address: "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359", decimals: 6 },
      USDTE: { symbol: "USDT.e", type: "erc20", address: "0xc2132D05D31c914a87C6611C10748AEb04B58e8F", decimals: 6 },
      PAXG: { symbol: "PAXG", type: "erc20", address: "0x714db550b574b3e927fb3d93e26127d15721d4c2", decimals: 18 }
    };

    const ERC20_ABI = [
      "function transfer(address recipient, uint256 amount) external returns (bool)"
    ];

    let provider = null;
    let signer = null;
    let userAddress = null;

    function setStatus(msg, isError = false) {
      const el = document.getElementById('statusBox');
      if (!el) return;
      el.innerHTML = msg;
      if (isError) {
        el.style.borderColor = 'rgba(239, 68, 68, 0.4)';
        el.style.color = '#fca5a5';
        el.style.background = 'rgba(239, 68, 68, 0.1)';
      } else {
        el.style.borderColor = 'var(--green-accent)';
        el.style.color = 'var(--green-bright)';
        el.style.background = 'rgba(16, 185, 129, 0.08)';
      }
    }

    async function connectWallet() {
      if (!window.ethereum) {
        return setStatus("No Web3 wallet detected. Please install Rabby, OKX, or MetaMask.", true);
      }

      try {
        setStatus("Connecting wallet...");
        const chainId = await window.ethereum.request({ method: 'eth_chainId' });

        if (chainId !== CONFIG.chainIdHex) {
          try {
            await window.ethereum.request({
              method: 'wallet_switchEthereumChain',
              params: [{ chainId: CONFIG.chainIdHex }]
            });
          } catch (switchErr) {
            return setStatus("Please switch network to Polygon Mainnet in your wallet.", true);
          }
        }

        provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();
        userAddress = await signer.getAddress();

        const short = userAddress.substring(0, 6) + "..." + userAddress.substring(userAddress.length - 4);
        document.getElementById('connectBtn').textContent = short;
        setStatus("Wallet connected: " + short);
      } catch (e) {
        setStatus(e.reason || e.message || "Wallet connection rejected.", true);
      }
    }

    async function sendInstant() {
      if (!signer) return setStatus("Please connect your wallet first.", true);

      const recipient = document.getElementById('instantRecipient')?.value.trim();
      const rawAmount = document.getElementById('instantAmount')?.value.trim();
      const assetKey = document.getElementById('instantAsset')?.value || 'POL';
      const token = TOKENS[assetKey];

      if (!ethers.isAddress(recipient)) return setStatus("Invalid recipient wallet address.", true);
      if (!rawAmount || Number(rawAmount) <= 0) return setStatus("Please enter a valid amount.", true);

      try {
        const amountWei = ethers.parseUnits(rawAmount, token.decimals);
        setStatus(`Initiating ${token.symbol} transfer... Please confirm in wallet.`);

        let tx;
        if (token.type === 'native') {
          tx = await signer.sendTransaction({ to: recipient, value: amountWei });
        } else {
          const tokenContract = new ethers.Contract(token.address, ERC20_ABI, signer);
          tx = await tokenContract.transfer(recipient, amountWei);
        }

        setStatus("Transaction submitted! Waiting for Polygon network confirmation... Hash: " + tx.hash.substring(0, 12) + "...");
        await tx.wait();
        setStatus(`Instant ${token.symbol} transfer completed successfully!`, false);
      } catch (e) {
        setStatus(e.reason || e.message || "Transfer failed or cancelled.", true);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (window.ethereum) {
        window.ethereum.request({ method: 'eth_accounts' }).then(accounts => {
          if (accounts && accounts.length > 0) connectWallet();
        }).catch(() => {});

        window.ethereum.on('accountsChanged', () => window.location.reload());
        window.ethereum.on('chainChanged', () => window.location.reload());
      }
    });
  </script>
</body>
</html>
