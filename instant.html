<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeBridge Global — Instant Transfer</title>

  <script>
    function ensureEthersLoaded() {
      return new Promise((resolve, reject) => {
        if (window.ethers) return resolve(window.ethers);

        const cdns = [
          "https://cdnjs.cloudflare.com/ajax/libs/ethers/6.11.1/ethers.umd.min.js",
          "https://cdn.jsdelivr.net/npm/ethers@6.11.1/dist/ethers.umd.min.js",
          "https://unpkg.com/ethers@6.11.1/dist/ethers.umd.min.js"
        ];

        let index = 0;

        function loadNext() {
          if (index >= cdns.length) {
            return reject(new Error("Ethers library failed to load across all CDNs."));
          }

          const script = document.createElement('script');
          script.src = cdns[index++];
          script.onload = () => resolve(window.ethers);
          script.onerror = () => loadNext();
          document.head.appendChild(script);
        }

        loadNext();
      });
    }
  </script>

  <style>
    :root {
      --bg: #030712;
      --panel: #0b0f19;
      --card-bg: #111827;
      --border: #1f2937;
      --input-bg: #030712;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --emerald: #10b981;
      --red: #ef4444;
      --sky: #38bdf8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .nav-bar {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 18px;
      color: var(--sky);
    }

    .btn-nav {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-nav:hover { background: #334155; }

    .btn-connect {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-connect:hover { background: var(--primary-hover); }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .status-badge-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 13px;
    }

    .network-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--emerald);
      font-weight: 600;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: var(--emerald);
      border-radius: 50%;
    }

    h2 {
      margin: 0 0 8px 0;
      font-size: 26px;
      font-weight: 800;
    }

    .desc {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 18px;
    }

    .label-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .bal-text {
      font-size: 12px;
      color: var(--sky);
      font-weight: 600;
    }

    .input-group {
      position: relative;
      display: flex;
      align-items: center;
    }

    input, select {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 14px;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .btn-max {
      position: absolute;
      right: 10px;
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--sky);
      font-weight: 700;
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-max:hover {
      background: #334155;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 12px;
    }

    .btn-send {
      width: 100%;
      background: linear-gradient(90deg, #6366f1, #818cf8);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s;
    }

    .btn-send:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .msg-box {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      font-size: 13px;
      word-break: break-all;
      background: rgba(31, 41, 55, 0.5);
      border: 1px solid var(--border);
      color: var(--muted);
      line-height: 1.5;
    }

    .msg-box a {
      color: var(--sky);
      text-decoration: underline;
      font-weight: 600;
    }

    .footer {
      margin-top: 30px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="nav-bar">
    <div class="logo">
      <span>⚡ SafeBridge Transfer</span>
    </div>
    <div>
      <a href="index.html" class="btn-nav">← Escrow App</a>
      <button id="connectBtn" class="btn-connect" onclick="connectWallet()">Connect Wallet</button>
    </div>
  </div>

  <div class="card">
    <div class="status-badge-box">
      <div>
        <div style="color: var(--muted); font-size: 11px;">Connected Wallet</div>
        <div id="addrDisplay" style="font-weight: 700; margin-top: 2px;">Not Connected</div>
      </div>
      <div class="network-badge">
        <span class="dot"></span> Polygon Mainnet
      </div>
    </div>

    <h2>Instant Transfer</h2>
    <p class="desc">
      Direct wallet-to-wallet transfers for POL, USDT, USDT.e, and PAXG on Polygon Mainnet.
    </p>

    <div class="field">
      <label for="recipient">Recipient Wallet Address</label>
      <input type="text" id="recipient" placeholder="0x..." style="margin-top: 6px;" />
    </div>

    <div class="grid-2">
      <div class="field">
        <div class="label-wrapper">
          <label for="amount">Amount</label>
          <span id="balDisplay" class="bal-text">Balance: --</span>
        </div>
        <div class="input-group">
          <input type="number" id="amount" placeholder="0.0" step="0.000001" min="0" />
          <button class="btn-max" onclick="setMaxAmount()">MAX</button>
        </div>
      </div>
      <div class="field">
        <div class="label-wrapper">
          <label for="assetSelect">Asset</label>
        </div>
        <select id="assetSelect" onchange="updateBalanceDisplay()">
          <option value="POL">POL (Native)</option>
          <option value="USDT">USDT</option>
          <option value="USDTE">USDT.e</option>
          <option value="PAXG">PAXG</option>
        </select>
      </div>
    </div>

    <button class="btn-send" onclick="sendTransfer()">⚡ Send Instant Transfer</button>

    <div id="statusBox" class="msg-box">System initializing...</div>
  </div>

  <div class="footer">
    SafeBridge Global © 2026 — Polygon Mainnet Instant Transfer Module
  </div>

  <script>
    const CONFIG = {
      chainIdHex: "0x89",
      chainIdDec: 137
    };

    const TOKENS = {
      POL: { symbol: "POL", type: "native", address: null, decimals: 18 },
      USDT: { symbol: "USDT", type: "erc20", address: "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359", decimals: 6 },
      USDTE: { symbol: "USDT.e", type: "erc20", address: "0xc2132D05D31c914a87C6611C10748AEb04B58e8F", decimals: 6 },
      PAXG: { symbol: "PAXG", type: "erc20", address: "0x714db550b574b3e927fb3d93e26127d15721d4c2", decimals: 18 }
    };

    const ERC20_ABI = [
      "function transfer(address to, uint256 amount) external returns (bool)",
      "function balanceOf(address account) external view returns (uint256)"
    ];

    let provider = null;
    let signer = null;
    let connectedAccount = null;
    let rawBalance = 0n;

    /* --- ERROR PARSER --- */
    function parseWeb3Error(error) {
      if (!error) return "An unknown error occurred.";
      if (error.code === 4001 || error.code === 'ACTION_REJECTED') {
        return "Transaction rejected by user in wallet.";
      }
      if (error.code === 'INSUFFICIENT_FUNDS' || error.message?.includes('insufficient funds')) {
        return "Insufficient funds in your account for this transfer and gas fee.";
      }
      return error.reason || error.shortMessage || error.message || "Transfer transaction failed.";
    }

    function setStatus(htmlMsg, type = 'info') {
      const box = document.getElementById('statusBox');
      box.innerHTML = htmlMsg;
      if (type === 'error') {
        box.style.borderColor = 'rgba(239, 68, 68, 0.4)';
        box.style.color = '#fca5a5';
        box.style.background = 'rgba(239, 68, 68, 0.1)';
      } else if (type === 'success') {
        box.style.borderColor = 'rgba(16, 185, 129, 0.4)';
        box.style.color = '#6ee7b7';
        box.style.background = 'rgba(16, 185, 129, 0.1)';
      } else {
        box.style.borderColor = 'var(--border)';
        box.style.color = 'var(--muted)';
        box.style.background = 'rgba(31, 41, 55, 0.5)';
      }
    }

    /* --- BALANCE DISPLAY & MAX BUTTON LOGIC --- */
    async function updateBalanceDisplay() {
      const balEl = document.getElementById('balDisplay');
      if (!signer || !connectedAccount) {
        balEl.textContent = "Balance: --";
        return;
      }

      const selectedKey = document.getElementById('assetSelect').value;
      const token = TOKENS[selectedKey];

      try {
        balEl.textContent = "Loading...";
        if (token.type === 'native') {
          rawBalance = await provider.getBalance(connectedAccount);
        } else {
          const tokenContract = new ethers.Contract(token.address, ERC20_ABI, provider);
          rawBalance = await tokenContract.balanceOf(connectedAccount);
        }

        const formatted = ethers.formatUnits(rawBalance, token.decimals);
        const displayVal = Number(formatted).toLocaleString('en-US', { maximumFractionDigits: 4 });
        balEl.textContent = `Balance: ${displayVal} ${token.symbol}`;
      } catch (e) {
        console.error("Failed to read balance:", e);
        balEl.textContent = "Balance unavailable";
      }
    }

    function setMaxAmount() {
      if (!connectedAccount || rawBalance === 0n) return;
      const selectedKey = document.getElementById('assetSelect').value;
      const token = TOKENS[selectedKey];
      
      let maxVal = ethers.formatUnits(rawBalance, token.decimals);
      
      // Leave a small buffer for POL native transfers to cover gas (0.01 POL)
      if (token.type === 'native') {
        const gasBuffer = ethers.parseUnits("0.01", token.decimals);
        if (rawBalance > gasBuffer) {
          maxVal = ethers.formatUnits(rawBalance - gasBuffer, token.decimals);
        }
      }
      document.getElementById('amount').value = maxVal;
    }

    /* --- WALLET CONNECTION --- */
    async function setupConnectedState(accountAddress) {
      try {
        await ensureEthersLoaded();
        provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();
        connectedAccount = accountAddress;

        const shortAddr = `${connectedAccount.substring(0, 6)}...${connectedAccount.substring(38)}`;
        document.getElementById('addrDisplay').textContent = shortAddr;
        document.getElementById('connectBtn').textContent = shortAddr;

        setStatus("Wallet connected successfully.", "success");
        await updateBalanceDisplay();
      } catch (e) {
        console.error("Setup error:", e);
        setStatus("Failed to initialize wallet session.", "error");
      }
    }

    function clearConnectedState() {
      connectedAccount = null;
      signer = null;
      provider = null;
      rawBalance = 0n;
      document.getElementById('addrDisplay').textContent = "Not Connected";
      document.getElementById('connectBtn').textContent = "Connect Wallet";
      document.getElementById('balDisplay').textContent = "Balance: --";
      setStatus("Wallet disconnected.");
    }

    async function connectWallet() {
      try {
        await ensureEthersLoaded();
      } catch (e) {
        return setStatus("Ethers.js library failed to load.", "error");
      }

      if (!window.ethereum) {
        return setStatus("No Web3 wallet detected. Please install Rabby or MetaMask.", "error");
      }

      try {
        setStatus("Connecting to wallet...");

        const chainId = await window.ethereum.request({ method: 'eth_chainId' });
        if (chainId !== CONFIG.chainIdHex) {
          try {
            await window.ethereum.request({
              method: 'wallet_switchEthereumChain',
              params: [{ chainId: CONFIG.chainIdHex }]
            });
          } catch (e) {
            return setStatus("Please switch your wallet to Polygon Mainnet.", "error");
          }
        }

        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        if (accounts.length > 0) {
          await setupConnectedState(accounts[0]);
        }
      } catch (e) {
        setStatus(parseWeb3Error(e), "error");
      }
    }

    /* --- TRANSFER TRANSACTION --- */
    async function sendTransfer() {
      if (!signer || !connectedAccount) return setStatus("Please connect your wallet first.", "error");

      const recipient = document.getElementById('recipient').value.trim();
      const rawAmount = document.getElementById('amount').value.trim();
      const selectedKey = document.getElementById('assetSelect').value;
      const token = TOKENS[selectedKey];

      if (!ethers.isAddress(recipient)) return setStatus("Invalid recipient wallet address.", "error");
      if (!rawAmount || Number(rawAmount) <= 0) return setStatus("Please enter a valid amount greater than 0.", "error");

      try {
        const parsedAmount = ethers.parseUnits(rawAmount, token.decimals);
        
        if (parsedAmount > rawBalance) {
          return setStatus(`Insufficient balance. You do not have enough ${token.symbol}.`, "error");
        }

        setStatus(`Preparing ${token.symbol} transfer... Please confirm in your wallet.`);

        let tx;
        if (token.type === 'native') {
          tx = await signer.sendTransaction({
            to: recipient,
            value: parsedAmount
          });
        } else {
          const tokenContract = new ethers.Contract(token.address, ERC20_ABI, signer);
          tx = await tokenContract.transfer(recipient, parsedAmount);
        }

        setStatus(`Transaction submitted. Awaiting network confirmation...<br>Tx Hash: <code>${tx.hash.substring(0, 10)}...${tx.hash.substring(58)}</code>`);
        const receipt = await tx.wait();

        const scanUrl = `https://polygonscan.com/tx/${receipt.hash}`;
        setStatus(`
          ⚡ Transfer completed successfully!<br>
          <strong>Tx Hash:</strong> <a href="${scanUrl}" target="_blank">${receipt.hash.substring(0, 16)}... ↗</a>
        `, "success");

        await updateBalanceDisplay();
      } catch (e) {
        setStatus(parseWeb3Error(e), "error");
      }
    }

    /* --- INITIALIZATION & EVENT LISTENERS --- */
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        await ensureEthersLoaded();
        setStatus("System ready. Please connect your wallet.");

        if (window.ethereum) {
          const accounts = await window.ethereum.request({ method: 'eth_accounts' });
          if (accounts.length > 0) {
            await setupConnectedState(accounts[0]);
          }

          window.ethereum.on('accountsChanged', async (accs) => {
            if (accs.length > 0) {
              await setupConnectedState(accs[0]);
            } else {
              clearConnectedState();
            }
          });

          window.ethereum.on('chainChanged', () => {
            window.location.reload();
          });
        }
      } catch (err) {
        setStatus("Ethers library failed to load. Please check your internet connection.", "error");
      }
    });
  </script>
</body>
</html>
